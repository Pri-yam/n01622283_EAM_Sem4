<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef3f9;
            margin: 0;
            padding: 0;
        }
        h2 {
            text-align: center;
            margin-top: 20px;
            color: #2c3e50;
        }
        form {
            background: #fff;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            margin-top: 6px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 10px;
            margin-top: 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1e8f4c;
        }
    </style>
</head>
<body>
<h2>Payment Details</h2>
<form th:action="@{/payment/save}" th:object="${payment}" method="post">
    <label for="amount">Amount:</label>
    <input type="number" step="0.01" th:field="*{amount}" id="amount" required />

    <label for="method">Method:</label>
    <input type="text" th:field="*{method}" id="method" required />

    <!-- Hidden reservationId so payment links back to reservation -->
    <input type="hidden" th:field="*{reservationId}" />

    <button type="submit">Pay Now</button>
</form>

</body>
</html>
