<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reservation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef3f9;
            margin: 0;
            padding: 0;
        }
        h2 {
            text-align: center;
            margin-top: 20px;
            color: #2c3e50;
        }
        form {
            background: #fff;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            margin-top: 6px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #2980b9;
            color: white;
            padding: 10px;
            margin-top: 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1f6391;
        }
    </style>
</head>
<body>
<h2>Husky Air Reservation</h2>
<form th:action="@{/reservation/save}" th:object="${reservation}" method="post">
    <label for="firstName">First Name:</label>
    <input type="text" th:field="*{firstName}" id="firstName" required />

    <label for="lastName">Last Name:</label>
    <input type="text" th:field="*{lastName}" id="lastName" required />

    <label for="email">Email:</label>
    <input type="email" th:field="*{email}" id="email" required />

    <label for="numPassengers">Passengers:</label>
    <input type="number" th:field="*{numPassengers}" id="numPassengers" min="1" required />

    <label for="classType">Class:</label>
    <select th:field="*{classType}" id="classType">
        <option value="Economy">Economy</option>
        <option value="Business">Business</option>
    </select>

    <label for="phoneNumber">Phone:</label>
    <input type="text" th:field="*{phoneNumber}" id="phoneNumber" required />

    <label for="departTime">Depart Time:</label>
    <input type="time" th:field="*{departTime}" id="departTime" required />

    <label for="departDate">Depart Date:</label>
    <input type="date" th:field="*{departDate}" id="departDate" required />

    <button type="submit">Next</button>
</form>

</body>
</html>
